<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- font-size in em is resolved against the parent's font-size, which
       falls back to the SVG default (16px) here, so 2em -> 32px. -->
  <text x="10" y="40" font-size="2em" fill="#226">font-size 2em</text>

  <!-- ex is approximated as 0.5em, so 4ex -> 32px. -->
  <text x="10" y="90" font-size="4ex" fill="#622">font-size 4ex</text>

  <!-- em on x/y must use this element's own font-size, even though x/y
       appear before font-size in the source order. -->
  <text x="2em" y="9em" font-size="20" fill="#444">x=2em y=9em font-size=20</text>

  <!-- Visual coverage with shapes (no font dependency). The two rects
       below should render with identical width 32px:
         2em -> 2 * 16 = 32
         4ex -> 4 * 8  = 32 -->
  <rect x="10" y="170" width="2em" height="20" fill="#226"/>
  <rect x="50" y="170" width="4ex" height="20" fill="#622"/>

  <!-- 0.25in reference rect = 24px, visibly narrower than the 32px ones. -->
  <rect x="90" y="170" width="0.25in" height="20" fill="#000"/>

  <!-- stroke-width in em on a non-text element falls back to the default
       font-size, since there is no text ancestor: 0.25em -> 4px. -->
  <line x1="10" y1="205" x2="390" y2="205" stroke="#000" stroke-width="0.25em"/>
</svg>